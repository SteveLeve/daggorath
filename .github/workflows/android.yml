# Android build check (Phase 9, ADR-0012).
# Builds (first run untested as of 2026-09-30) the debug APK for arm64-v8a and x86_64 against the pinned SDL3 tree.
# There is deliberately no artifact upload and no release step: this is a
# public repository and the APK carries the copied original data
# (DATA-NOTICE.md), so any upload would be distribution, which
# docs/licensing/README.md D3/D5 do not allow. Private devices get their
# build from a local `make android` on the owner's machine.
name: android

on:
  pull_request:
    paths: ["src/**", "android/**", "tools/android/**", "CMakeLists.txt", "Makefile", ".github/workflows/android.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1  # v4.4.4
        with:
          gradle-version: 8.14.3
      - run: make android
