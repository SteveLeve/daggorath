<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Daggorath">
<title>Dungeons of Daggorath</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  /* ADR-0011 web stopgap. The canvas is the SDL window; everything the
     player touches is drawn by the game's own overlay inside it. */
  html, body {
    margin: 0; height: 100%; background: #000; color: #fff;
    overflow: hidden; overscroll-behavior: none;
    font: 16px/1.4 ui-monospace, Menlo, Consolas, monospace;
  }
  #stage {
    position: fixed; overflow: hidden;
    top: env(safe-area-inset-top); right: env(safe-area-inset-right);
    bottom: env(safe-area-inset-bottom); left: env(safe-area-inset-left);
  }
  /* The canvas fills the safe area; the game letterboxes itself inside it
     (SDL logical presentation, see fit_to_window in sdl_app.cpp). */
  #canvas {
    display: block; width: 100%; height: 100%;
    touch-action: none; outline: none;
  }
  .notice {
    position: fixed; inset: 0; display: none; align-items: center;
    justify-content: center; text-align: center; padding: 16px;
    background: #000; z-index: 2;
  }
  .notice.show { display: flex; }
  @media (orientation: portrait) and (pointer: coarse) {
    #rotate { display: flex; }
  }
</style>
</head>
<body>
<div id="stage"><canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas></div>
<div id="status" class="notice show">LOADING…</div>
<div id="rotate" class="notice">TURN THE DEVICE TO LANDSCAPE</div>
<script>
  "use strict";
  const canvas = document.getElementById("canvas");
  const status = document.getElementById("status");

  // Same flags as the desktop build. ?layout=phone|tablet wins; otherwise a
  // wide screen gets the phone layout, with controls in the side margins.
  const query = new URLSearchParams(location.search);
  const wide = Math.max(innerWidth, innerHeight) / Math.min(innerWidth, innerHeight) > 1.6;
  const layout = query.get("layout") === "phone" || query.get("layout") === "tablet"
    ? query.get("layout") : (wide ? "phone" : "tablet");

  var Module = {
    canvas,
    arguments: [`--layout=${layout}`],
    print: (text) => console.log(text),
    printErr: (text) => console.warn(text),
    onRuntimeInitialized: () => { status.classList.remove("show"); canvas.focus(); },
    onAbort: () => { status.textContent = "THE GAME STOPPED. RELOAD TO PLAY AGAIN."; status.classList.add("show"); },
    onExit: () => { status.textContent = "GAME CLOSED. RELOAD TO PLAY AGAIN."; status.classList.add("show"); },
  };
  // A trap inside the game is an uncaught error, not an abort.
  addEventListener("error", Module.onAbort);
  canvas.addEventListener("pointerdown", () => canvas.focus());

  if ("serviceWorker" in navigator && location.protocol === "https:")
    navigator.serviceWorker.register("sw.js");
</script>
<script async src="dod.js"></script>
</body>
</html>
